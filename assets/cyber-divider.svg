<svg width="100%" height="16" viewBox="0 0 1000 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <line x1="50" y1="8" x2="950" y2="8" stroke="url(#dividerGrad)" stroke-width="2" filter="url(#lineGlow)" stroke-linecap="round" />
  <circle cx="500" cy="8" r="4" fill="#00F0FF" />
  <circle cx="500" cy="8" r="7" stroke="#00F0FF" stroke-opacity="0.4" />
