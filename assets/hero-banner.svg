<svg width="100%" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1224" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Cyberpunk Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="850" cy="50" r="140" fill="#00F0FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="150" cy="210" r="160" fill="#3B82F6" opacity="0.08" filter="url(#glow)" />
  <circle cx="500" cy="130" r="90" fill="#8B5CF6" opacity="0.05" filter="url(#glow)" />

  <!-- Futuristic Grid Pattern Lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="260" />
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="250" y1="0" x2="250" y2="260" />
    <line x1="350" y1="0" x2="350" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="550" y1="0" x2="550" y2="260" />
    <line x1="650" y1="0" x2="650" y2="260" />
    <line x1="750" y1="0" x2="750" y2="260" />
    <line x1="850" y1="0" x2="850" y2="260" />
    <line x1="950" y1="0" x2="950" y2="260" />

    <line x1="0" y1="50" x2="1000" y2="50" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="200" x2="1000" y2="200" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 980 40 L 980 20 L 960 20" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 20 220 L 20 240 L 40 240" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 980 220 L 980 240 L 960 240" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Status / Availability Pill -->
  <g transform="translate(60, 42)">
    <rect width="190" height="28" rx="14" fill="#0D192E" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10B981" filter="url(#softGlow)" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.5">OPEN TO COLLABORATE</text>
  </g>

  <!-- Location & Focus Badge -->
  <g transform="translate(760, 42)">
    <rect width="180" height="28" rx="14" fill="#0D192E" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" />
    <text x="20" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">📍 INDORE, INDIA 🇮🇳</text>
  </g>

  <!-- Main Name Typography -->
  <g transform="translate(60, 120)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="1">
      GANESH PATEL
    </text>
    <text x="350" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#00F0FF" filter="url(#softGlow)">
      &lt;dev / sec&gt;
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(60, 155)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#38BDF8">
      Full Stack Developer <tspan fill="#64748B">|</tspan> Cybersecurity Student <tspan fill="#64748B">|</tspan> Founder @ IdeaFlow
    </text>
  </g>

  <!-- Pills / Core Focus Row -->
  <g transform="translate(60, 195)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="32" rx="8" fill="#111C33" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">⚡ Full Stack Systems</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(175, 0)">
      <rect width="165" height="32" rx="8" fill="#111C33" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🛡️ Cyber &amp; AppSec</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(355, 0)">
      <rect width="180" height="32" rx="8" fill="#111C33" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🚀 Building Products</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(550, 0)">
      <rect width="165" height="32" rx="8" fill="#111C33" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🌐 Open Source</text>
    </g>
  </g>

  <!-- Decorative High-Tech Right Graphic -->
  <g transform="translate(800, 110)">
    <circle cx="60" cy="40" r="45" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="60" cy="40" r="30" stroke="#3B82F6" stroke-width="1" opacity="0.5" />
    <circle cx="60" cy="40" r="12" fill="#00F0FF" opacity="0.2" />
    <circle cx="60" cy="40" r="4" fill="#00F0FF" filter="url(#glow)" />
    <!-- Orbiting nodes -->
    <circle cx="15" cy="40" r="3" fill="#38BDF8" />
    <circle cx="105" cy="40" r="3" fill="#8B5CF6" />
    <circle cx="60" cy="-5" r="3" fill="#00F0FF" />
    <circle cx="60" cy="85" r="3" fill="#10B981" />
  </g>
</svg>
